<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="100%" height="100%">
  <defs>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="blur" /><feComposite in="SourceGraphic" in2="blur" operator="over" /></filter>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.65" /></filter>
    <linearGradient id="bg-grad-uc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0c1329" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#00f3ff" /></marker>
    <marker id="arp" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#c084fc" /></marker>
    <marker id="are" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#10b981" /></marker>
  </defs>

  <rect width="1500" height="1000" fill="url(#bg-grad-uc)" />

  <!-- Header -->
  <rect x="30" y="20" width="1440" height="70" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#00f3ff" stroke-width="1.5" filter="url(#card-shadow)" />
  <text x="55" y="52" font-family="'Orbitron', monospace, sans-serif" font-size="20" font-weight="900" fill="#00f3ff" letter-spacing="2">UML · DIAGRAMA DE CASOS DE USO</text>
  <text x="55" y="74" font-family="'Rajdhani', sans-serif" font-size="14" font-weight="600" fill="#94a3b8">Interacciones entre Actores (Pilotos, Administrador, Redes Publicitarias) y Casos de Uso del Sistema</text>
  <text x="1270" y="60" font-family="monospace" font-size="11" fill="#38bdf8" font-weight="bold">UML USE CASE</text>

  <!-- Límite del Sistema (System Boundary) -->
  <rect x="340" y="115" width="820" height="815" rx="14" fill="rgba(15, 23, 42, 0.6)" stroke="#0284c7" stroke-width="2" />
  <text x="750" y="145" font-family="'Orbitron', monospace" font-size="14" font-weight="bold" fill="#00f3ff" text-anchor="middle">SISTEMA SPACE ASSAULT v2.0</text>

  <!-- ACTORES A LA IZQUIERDA -->
  <!-- 1. Piloto Registrado -->
  <g transform="translate(70, 240)">
    <circle cx="50" cy="30" r="18" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <line x1="50" y1="48" x2="50" y2="90" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="20" y1="65" x2="80" y2="65" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="50" y1="90" x2="25" y2="135" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="50" y1="90" x2="75" y2="135" stroke="#38bdf8" stroke-width="2.5" />
    <text x="50" y="160" font-family="'Orbitron', monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Piloto Registrado</text>
    <text x="50" y="178" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">&lt;&lt;Actor Principal&gt;&gt;</text>
  </g>

  <!-- 2. Piloto Invitado (Generalización) -->
  <g transform="translate(70, 520)">
    <circle cx="50" cy="30" r="18" fill="#334155" stroke="#94a3b8" stroke-width="2" />
    <line x1="50" y1="48" x2="50" y2="90" stroke="#94a3b8" stroke-width="2.5" />
    <line x1="20" y1="65" x2="80" y2="65" stroke="#94a3b8" stroke-width="2.5" />
    <line x1="50" y1="90" x2="25" y2="135" stroke="#94a3b8" stroke-width="2.5" />
    <line x1="50" y1="90" x2="75" y2="135" stroke="#94a3b8" stroke-width="2.5" />
    <text x="50" y="160" font-family="'Orbitron', monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Piloto Invitado</text>
    <text x="50" y="178" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">&lt;&lt;Actor Casual&gt;&gt;</text>
  </g>

  <!-- 3. Administrador -->
  <g transform="translate(70, 770)">
    <circle cx="50" cy="25" r="16" fill="#7e22ce" stroke="#c084fc" stroke-width="2" />
    <line x1="50" y1="41" x2="50" y2="78" stroke="#c084fc" stroke-width="2.5" />
    <line x1="25" y1="55" x2="75" y2="55" stroke="#c084fc" stroke-width="2.5" />
    <line x1="50" y1="78" x2="28" y2="115" stroke="#c084fc" stroke-width="2.5" />
    <line x1="50" y1="78" x2="72" y2="115" stroke="#c084fc" stroke-width="2.5" />
    <text x="50" y="135" font-family="'Orbitron', monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Administrador</text>
    <text x="50" y="150" font-family="monospace" font-size="9" fill="#c084fc" text-anchor="middle">&lt;&lt;Admin / Dev&gt;&gt;</text>
  </g>

  <!-- ACTORES A LA DERECHA (Sistemas Externos) -->
  <!-- 4. Redes Publicitarias -->
  <g transform="translate(1260, 320)">
    <rect width="180" height="110" rx="8" fill="#140821" stroke="#ec4899" stroke-width="2" filter="url(#card-shadow)" />
    <text x="90" y="32" font-family="'Orbitron', monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Redes Publicitarias</text>
    <text x="90" y="50" font-family="monospace" font-size="9" fill="#f472b6" text-anchor="middle">&lt;&lt;Sistema Externo&gt;&gt;</text>
    <text x="90" y="72" font-family="'Rajdhani', sans-serif" font-size="11" fill="#fbcfe8" text-anchor="middle">Monetag (Vignette)</text>
    <text x="90" y="88" font-family="'Rajdhani', sans-serif" font-size="11" fill="#fbcfe8" text-anchor="middle">GameDistribution (Ads)</text>
    <text x="90" y="102" font-family="'Rajdhani', sans-serif" font-size="11" fill="#fbcfe8" text-anchor="middle">CrazyGames SDK</text>
  </g>

  <!-- 5. Servidor Cloud / Hosting -->
  <g transform="translate(1260, 620)">
    <rect width="180" height="95" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="2" filter="url(#card-shadow)" />
    <text x="90" y="30" font-family="'Orbitron', monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Render Cloud Platform</text>
    <text x="90" y="48" font-family="monospace" font-size="9" fill="#fbbf24" text-anchor="middle">&lt;&lt;Sistema Externo&gt;&gt;</text>
    <text x="90" y="70" font-family="'Rajdhani', sans-serif" font-size="11" fill="#fde68a" text-anchor="middle">Alojamiento Web &amp; API</text>
    <text x="90" y="85" font-family="'Rajdhani', sans-serif" font-size="11" fill="#fde68a" text-anchor="middle">Persistencia SQLite en Disco</text>
  </g>

  <!-- CASOS DE USO (ÓVALOS) DENTRO DEL LÍMITE -->
  <!-- UC1: Registrar Piloto -->
  <g transform="translate(390, 170)">
    <ellipse cx="140" cy="30" rx="130" ry="26" fill="#082f49" stroke="#38bdf8" stroke-width="1.5" />
    <text x="140" y="34" font-family="'Rajdhani', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">UC-01: Registrar Piloto</text>
  </g>

  <!-- UC2: Iniciar Sesión (JWT) -->
  <g transform="translate(390, 240)">
    <ellipse cx="140" cy="30" rx="130" ry="26" fill="#082f49" stroke="#38bdf8" stroke-width="1.5" />
    <text x="140" y="34" font-family="'Rajdhani', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">UC-02: Iniciar Sesión (JWT)</text>
  </g>

  <!-- UC3: Despegue Rápido (Invitado) -->
  <g transform="translate(390, 310)">
    <ellipse cx="140" cy="30" rx="130" ry="26" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" />
    <text x="140" y="34" font-family="'Rajdhani', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">UC-03: Despegue Rápido (Guest)</text>
  </g>

  <!-- UC4: Seleccionar Caza de Combate -->
  <g transform="translate(390, 380)">
    <ellipse cx="140" cy="30" rx="130" ry="26" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.5" />
    <text x="140" y="34" font-family="'Rajdhani', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">UC-04: Seleccionar Caza</text>
  </g>

  <!-- UC5: Pilotar Nave a 60 FPS -->
  <g transform="translate(390, 450)">
    <ellipse cx="140" cy="30" rx="130" ry="26" fill="#0369a1" stroke="#00f3ff" stroke-width="2" />
    <text x="140" y="34" font-family="'Rajdhani', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">UC-05: Pilotar Nave a 60 FPS</text>
  </g>

  <!-- UC6: Lanzar Bomba Táctica [B] <<include>> -->
  <g transform="translate(730, 415)">
    <ellipse cx="130" cy="26" rx="120" ry="24" fill="#064e3b" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4,4" />
    <text x="130" y="30" font-family="'Rajdhani', sans-serif" font-size="12" font-weight="700" fill="#a7f3d0" text-anchor="middle">&lt;&lt;include&gt;&gt; UC-06: Bomba Táctica</text>
  </g>

  <!-- UC7: Combatir Super-Jefe Dreadnought <<include>> -->
  <g transform="translate(730, 480)">
    <ellipse cx="130" cy="26" rx="120" ry="24" fill="#064e3b" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4,4" />
    <text x="130" y="30" font-family="'Rajdhani', sans-serif" font-size="12" font-weight="700" fill="#a7f3d0" text-anchor="middle">&lt;&lt;include&gt;&gt; UC-07: Batalla con Jefe</text>
  </g>

  <!-- UC8: Superar Fase & Progresar -->
  <g transform="translate(390, 530)">
    <ellipse cx="140" cy="30" rx="130" ry="26" fill="#047857" stroke="#10b981" stroke-width="1.5" />
    <text x="140" y="34" font-family="'Rajdhani', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">UC-08: Superar Fase &amp; Progresar</text>
  </g>

  <!-- UC9: Revivir Nave con Escudo (Rewarded) <<extend>> -->
  <g transform="translate(730, 560)">
    <ellipse cx="140" cy="30" rx="135" ry="28" fill="#140821" stroke="#ec4899" stroke-width="2" />
    <text x="140" y="28" font-family="'Rajdhani', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;&lt;extend&gt;&gt; UC-09: Revivir con Escudo</text>
    <text x="140" y="44" font-family="monospace" font-size="9" fill="#f472b6" text-anchor="middle">(Ver Rewarded Ad voluntario +2 vidas)</text>
  </g>

  <!-- UC10: Visualizar Anuncio Interstitial <<extend>> -->
  <g transform="translate(730, 640)">
    <ellipse cx="140" cy="30" rx="135" ry="28" fill="#140821" stroke="#ec4899" stroke-width="2" />
    <text x="140" y="28" font-family="'Rajdhani', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;&lt;extend&gt;&gt; UC-10: Anuncio Interstitial</text>
    <text x="140" y="44" font-family="monospace" font-size="9" fill="#f472b6" text-anchor="middle">(Vignette en Game Over / Cooldown &gt; 75s)</text>
  </g>

  <!-- UC11: Guardar Puntuación en Ranking -->
  <g transform="translate(390, 670)">
    <ellipse cx="140" cy="30" rx="130" ry="26" fill="#4c1d95" stroke="#c084fc" stroke-width="1.5" />
    <text x="140" y="34" font-family="'Rajdhani', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">UC-11: Guardar Récord en Ranking</text>
  </g>

  <!-- UC12: Compartir en Redes & Bono +5 Vidas -->
  <g transform="translate(390, 745)">
    <ellipse cx="140" cy="30" rx="130" ry="26" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5" />
    <text x="140" y="34" font-family="'Rajdhani', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">UC-12: Compartir Récord (+5 Vidas)</text>
  </g>

  <!-- UC13: Auditar Métricas & Base de Datos -->
  <g transform="translate(390, 820)">
    <ellipse cx="140" cy="30" rx="130" ry="26" fill="#311042" stroke="#a855f7" stroke-width="1.5" />
    <text x="140" y="34" font-family="'Rajdhani', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">UC-13: Auditar Métricas &amp; BD</text>
  </g>

  <!-- RELACIONES (LÍNEAS) -->
  <!-- Piloto Registrado -> Casos de Uso -->
  <line x1="170" y1="260" x2="390" y2="200" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="170" y1="280" x2="390" y2="270" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="170" y1="300" x2="390" y2="410" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="170" y1="320" x2="390" y2="480" stroke="#00f3ff" stroke-width="2" />
  <line x1="170" y1="340" x2="390" y2="560" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="170" y1="360" x2="390" y2="700" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="170" y1="380" x2="390" y2="775" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Piloto Invitado -> Despegue Rápido & Vuelo -->
  <line x1="170" y1="580" x2="390" y2="340" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="170" y1="600" x2="390" y2="410" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="170" y1="610" x2="390" y2="480" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Administrador -> Auditar -->
  <line x1="170" y1="830" x2="390" y2="850" stroke="#c084fc" stroke-width="1.5" />

  <!-- Includes (UC05 -> UC06, UC07) -->
  <path d="M 670 470 L 730 445" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#are)" />
  <path d="M 670 490 L 730 505" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#are)" />

  <!-- Extends (Game Over / Victoria -> UC09, UC10) -->
  <path d="M 670 560 L 730 585" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arp)" />
  <path d="M 670 700 L 730 670" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arp)" />

  <!-- Redes Publicitarias -> UC09 & UC10 -->
  <line x1="1260" y1="375" x2="1010" y2="585" stroke="#ec4899" stroke-width="2" stroke-dasharray="4,4" />
  <line x1="1260" y1="395" x2="1010" y2="670" stroke="#ec4899" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Render Cloud -> UC11 & UC13 -->
  <line x1="1260" y1="670" x2="670" y2="700" stroke="#f59e0b" stroke-width="1.5" />
  <line x1="1260" y1="690" x2="670" y2="850" stroke="#f59e0b" stroke-width="1.5" />

  <!-- Leyenda inferior -->
  <g transform="translate(340, 940)">
    <rect width="820" height="40" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#334155" />
    <text x="25" y="25" font-family="'Orbitron', monospace" font-size="11" font-weight="bold" fill="#00f3ff">RELACIONES UML:</text>
    <line x1="180" y1="21" x2="220" y2="21" stroke="#38bdf8" stroke-width="2" />
    <text x="230" y="25" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1">Asociación Directa</text>
    <line x1="390" y1="21" x2="430" y2="21" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#are)" />
    <text x="440" y="25" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1">&lt;&lt;include&gt;&gt; (Obligatorio)</text>
    <line x1="620" y1="21" x2="660" y2="21" stroke="#ec4899" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arp)" />
    <text x="670" y="25" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1">&lt;&lt;extend&gt;&gt; (Condicional / Opcional)</text>
  </g>
</svg>