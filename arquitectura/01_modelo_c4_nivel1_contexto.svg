<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <defs>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    <marker id="arr-c" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#00f3ff" />
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#c084fc" />
    </marker>
    <marker id="arr-e" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#10b981" />
    </marker>
    <marker id="arr-a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect width="1400" height="950" fill="url(#bg-grad)" />

  <!-- Cuadrícula -->
  <g opacity="0.06" stroke="#00f3ff" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="950" /><line x1="50" y1="0" x2="50" y2="950" /><line x1="100" y1="0" x2="100" y2="950" /><line x1="150" y1="0" x2="150" y2="950" /><line x1="200" y1="0" x2="200" y2="950" /><line x1="250" y1="0" x2="250" y2="950" /><line x1="300" y1="0" x2="300" y2="950" /><line x1="350" y1="0" x2="350" y2="950" /><line x1="400" y1="0" x2="400" y2="950" /><line x1="450" y1="0" x2="450" y2="950" /><line x1="500" y1="0" x2="500" y2="950" /><line x1="550" y1="0" x2="550" y2="950" /><line x1="600" y1="0" x2="600" y2="950" /><line x1="650" y1="0" x2="650" y2="950" /><line x1="700" y1="0" x2="700" y2="950" /><line x1="750" y1="0" x2="750" y2="950" /><line x1="800" y1="0" x2="800" y2="950" /><line x1="850" y1="0" x2="850" y2="950" /><line x1="900" y1="0" x2="900" y2="950" /><line x1="950" y1="0" x2="950" y2="950" /><line x1="1000" y1="0" x2="1000" y2="950" /><line x1="1050" y1="0" x2="1050" y2="950" /><line x1="1100" y1="0" x2="1100" y2="950" /><line x1="1150" y1="0" x2="1150" y2="950" /><line x1="1200" y1="0" x2="1200" y2="950" /><line x1="1250" y1="0" x2="1250" y2="950" /><line x1="1300" y1="0" x2="1300" y2="950" /><line x1="1350" y1="0" x2="1350" y2="950" />
    <line x1="0" y1="0" x2="1400" y2="0" /><line x1="0" y1="50" x2="1400" y2="50" /><line x1="0" y1="100" x2="1400" y2="100" /><line x1="0" y1="150" x2="1400" y2="150" /><line x1="0" y1="200" x2="1400" y2="200" /><line x1="0" y1="250" x2="1400" y2="250" /><line x1="0" y1="300" x2="1400" y2="300" /><line x1="0" y1="350" x2="1400" y2="350" /><line x1="0" y1="400" x2="1400" y2="400" /><line x1="0" y1="450" x2="1400" y2="450" /><line x1="0" y1="500" x2="1400" y2="500" /><line x1="0" y1="550" x2="1400" y2="550" /><line x1="0" y1="600" x2="1400" y2="600" /><line x1="0" y1="650" x2="1400" y2="650" /><line x1="0" y1="700" x2="1400" y2="700" /><line x1="0" y1="750" x2="1400" y2="750" /><line x1="0" y1="800" x2="1400" y2="800" /><line x1="0" y1="850" x2="1400" y2="850" /><line x1="0" y1="900" x2="1400" y2="900" />
  </g>

  <!-- Header -->
  <rect x="30" y="25" width="1340" height="70" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#00f3ff" stroke-width="1.5" filter="url(#card-shadow)" />
  <text x="55" y="58" font-family="'Orbitron', monospace, sans-serif" font-size="20" font-weight="900" fill="#00f3ff" letter-spacing="2">MODELO C4 · NIVEL 1: CONTEXTO DEL SISTEMA</text>
  <text x="55" y="80" font-family="'Rajdhani', sans-serif" font-size="14" font-weight="600" fill="#94a3b8">Límites del Sistema Space Assault, Actores (Pilotos) y Sistemas Externos de Distribución y Monetización</text>
  <text x="1120" y="66" font-family="monospace" font-size="11" fill="#38bdf8" font-weight="bold">C4 SYSTEM CONTEXT</text>

  <!-- ACTORES (Izquierda) -->
  <!-- Actor 1: Piloto Registrado -->
  <g transform="translate(60, 200)">
    <rect width="250" height="150" rx="10" fill="#082f49" stroke="#38bdf8" stroke-width="2" filter="url(#card-shadow)" />
    <circle cx="125" cy="45" r="22" fill="#0284c7" />
    <circle cx="125" cy="38" r="10" fill="#e0f2fe" />
    <path d="M 110 58 Q 125 48 140 58" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" />
    <text x="125" y="90" font-family="'Orbitron', monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Piloto Registrado</text>
    <text x="125" y="108" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">[Persona / Gamer]</text>
    <text x="125" y="128" font-family="'Rajdhani', sans-serif" font-size="12" fill="#bae6fd" text-anchor="middle">Inicia sesión con JWT, guarda récords,</text>
    <text x="125" y="142" font-family="'Rajdhani', sans-serif" font-size="12" fill="#bae6fd" text-anchor="middle">desbloquea naves y compite en ranking.</text>
  </g>

  <!-- Actor 2: Piloto Invitado -->
  <g transform="translate(60, 420)">
    <rect width="250" height="150" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="2" filter="url(#card-shadow)" />
    <circle cx="125" cy="45" r="22" fill="#334155" />
    <circle cx="125" cy="38" r="10" fill="#cbd5e1" />
    <path d="M 110 58 Q 125 48 140 58" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <text x="125" y="90" font-family="'Orbitron', monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Piloto Invitado (Guest)</text>
    <text x="125" y="108" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">[Persona / Casual]</text>
    <text x="125" y="128" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Juega directamente vía Despegue Rápido</text>
    <text x="125" y="142" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">desde la web o portales externos.</text>
  </g>

  <!-- Actor 3: Moderador / Admin -->
  <g transform="translate(60, 640)">
    <rect width="250" height="150" rx="10" fill="#311042" stroke="#c084fc" stroke-width="2" filter="url(#card-shadow)" />
    <circle cx="125" cy="45" r="22" fill="#7e22ce" />
    <circle cx="125" cy="38" r="10" fill="#f3e8ff" />
    <path d="M 110 58 Q 125 48 140 58" fill="none" stroke="#f3e8ff" stroke-width="3" stroke-linecap="round" />
    <text x="125" y="90" font-family="'Orbitron', monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Administrador</text>
    <text x="125" y="108" font-family="monospace" font-size="10" fill="#c084fc" text-anchor="middle">[Persona / Operador]</text>
    <text x="125" y="128" font-family="'Rajdhani', sans-serif" font-size="12" fill="#e9d5ff" text-anchor="middle">Audita puntuaciones, administra BD</text>
    <text x="125" y="142" font-family="'Rajdhani', sans-serif" font-size="12" fill="#e9d5ff" text-anchor="middle">y supervisa métricas de publicidad.</text>
  </g>

  <!-- SISTEMA CENTRAL (C4 Software System) -->
  <g transform="translate(480, 260)">
    <rect width="440" height="460" rx="16" fill="rgba(15, 23, 42, 0.95)" stroke="#00f3ff" stroke-width="3" filter="url(#card-shadow)" />
    <rect x="0" y="0" width="440" height="70" rx="16" fill="linear-gradient(135deg, #0e7490, #1e1b4b)" />
    <text x="220" y="38" font-family="'Orbitron', monospace" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">SPACE ASSAULT v2.0</text>
    <text x="220" y="58" font-family="monospace" font-size="12" fill="#00f3ff" font-weight="bold" text-anchor="middle">[Sistema de Software Central]</text>
    
    <text x="30" y="105" font-family="'Rajdhani', sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Proporciona combate aeroespacial a 60 FPS, gestión</text>
    <text x="30" y="125" font-family="'Rajdhani', sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">de hangares, progresión táctica, persistencia de pilotos</text>
    <text x="30" y="145" font-family="'Rajdhani', sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">y orquestación de monetización multiplataforma.</text>

    <!-- Submódulos embebidos ilustrativos -->
    <rect x="30" y="170" width="380" height="75" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="1.2" />
    <text x="45" y="195" font-family="'Orbitron', monospace" font-size="12" font-weight="bold" fill="#38bdf8">Frontend Web SPA (Canvas 60 FPS)</text>
    <text x="45" y="215" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1">Renderizado vectorial, audio sintetizado, HUD y controles táctiles.</text>
    <text x="45" y="232" font-family="monospace" font-size="10" fill="#94a3b8">HTML5 · Vanilla JavaScript · CSS Cyberpunk</text>

    <rect x="30" y="260" width="380" height="75" rx="8" fill="#140821" stroke="#c084fc" stroke-width="1.2" />
    <text x="45" y="285" font-family="'Orbitron', monospace" font-size="12" font-weight="bold" fill="#c084fc">Backend API RESTful &amp; Auth JWT</text>
    <text x="45" y="305" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1">Endpoints de autenticación, puntuaciones, estado y salud.</text>
    <text x="45" y="322" font-family="monospace" font-size="10" fill="#94a3b8">Python 3.11 · Flask · Gunicorn · CORS</text>

    <rect x="30" y="350" width="380" height="85" rx="8" fill="#042f2e" stroke="#10b981" stroke-width="1.2" />
    <text x="45" y="375" font-family="'Orbitron', monospace" font-size="12" font-weight="bold" fill="#34d399">Universal Ads Manager (Gamer-First)</text>
    <text x="45" y="395" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1">Control de cooldown (75s), rescates rewarded voluntarios y</text>
    <text x="45" y="410" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1">detección de plataforma (Render, GameDistribution, CrazyGames).</text>
    <text x="45" y="425" font-family="monospace" font-size="10" fill="#94a3b8">Adaptador Multiplataforma Desacoplado</text>
  </g>

  <!-- SISTEMAS EXTERNOS (Derecha) -->
  <!-- 1. Monetag Network -->
  <g transform="translate(1050, 150)">
    <rect width="290" height="120" rx="10" fill="#140821" stroke="#ec4899" stroke-width="2" filter="url(#card-shadow)" />
    <text x="145" y="32" font-family="'Orbitron', monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Monetag Ad Network</text>
    <text x="145" y="50" font-family="monospace" font-size="10" fill="#f472b6" text-anchor="middle">[Sistema Externo · Zona 12128966]</text>
    <text x="145" y="75" font-family="'Rajdhani', sans-serif" font-size="12" fill="#fbcfe8" text-anchor="middle">Entrega anuncios Vignette Banner</text>
    <text x="145" y="90" font-family="'Rajdhani', sans-serif" font-size="12" fill="#fbcfe8" text-anchor="middle">a pantalla completa en la web de Render.</text>
    <text x="145" y="105" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">vignette.min.js · CPM / CPC Global</text>
  </g>

  <!-- 2. GameDistribution (Azerion) -->
  <g transform="translate(1050, 310)">
    <rect width="290" height="135" rx="10" fill="#042f2e" stroke="#10b981" stroke-width="2" filter="url(#card-shadow)" />
    <text x="145" y="32" font-family="'Orbitron', monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">GameDistribution (Azerion)</text>
    <text x="145" y="50" font-family="monospace" font-size="10" fill="#34d399" text-anchor="middle">[Red de Distribución · GUID 79378]</text>
    <text x="145" y="75" font-family="'Rajdhani', sans-serif" font-size="12" fill="#a7f3d0" text-anchor="middle">Distribuye el juego a miles de portales.</text>
    <text x="145" y="90" font-family="'Rajdhani', sans-serif" font-size="12" fill="#a7f3d0" text-anchor="middle">Sirve Interstitial y Rewarded Video.</text>
    <text x="145" y="105" font-family="'Rajdhani', sans-serif" font-size="12" fill="#a7f3d0" text-anchor="middle">Divide ganancias 50/50 con publishers.</text>
    <text x="145" y="122" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">html5.api.gamedistribution.com</text>
  </g>

  <!-- 3. CrazyGames Portal -->
  <g transform="translate(1050, 485)">
    <rect width="290" height="120" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" filter="url(#card-shadow)" />
    <text x="145" y="32" font-family="'Orbitron', monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">CrazyGames SDK</text>
    <text x="145" y="50" font-family="monospace" font-size="10" fill="#a5b4fc" text-anchor="middle">[Portal Global · +30M Jugadores]</text>
    <text x="145" y="75" font-family="'Rajdhani', sans-serif" font-size="12" fill="#c7d2fe" text-anchor="middle">Provee anuncios midgame y rewarded</text>
    <text x="145" y="90" font-family="'Rajdhani', sans-serif" font-size="12" fill="#c7d2fe" text-anchor="middle">para audiencias de alta tarifa (US/EU).</text>
    <text x="145" y="105" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">sdk.crazygames.com</text>
  </g>

  <!-- 4. Render Cloud Hosting -->
  <g transform="translate(1050, 645)">
    <rect width="290" height="120" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="2" filter="url(#card-shadow)" />
    <text x="145" y="32" font-family="'Orbitron', monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Render Cloud Platform</text>
    <text x="145" y="50" font-family="monospace" font-size="10" fill="#fbbf24" text-anchor="middle">[Infraestructura Cloud / CI-CD]</text>
    <text x="145" y="75" font-family="'Rajdhani', sans-serif" font-size="12" fill="#fde68a" text-anchor="middle">Aloja el servicio web oficial con HTTPS,</text>
    <text x="145" y="90" font-family="'Rajdhani', sans-serif" font-size="12" fill="#fde68a" text-anchor="middle">despliegue continuo desde GitHub y disco.</text>
    <text x="145" y="105" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">space-assault.onrender.com</text>
  </g>

  <!-- CONECTORES (Flechas) -->
  <!-- Actores -> Sistema -->
  <path d="M 310 275 L 480 380" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-cyan)" stroke-dasharray="4,4" />
  <text x="370" y="310" font-family="monospace" font-size="10" fill="#38bdf8">Juega / Guarda récord</text>

  <path d="M 310 495 L 480 490" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr-cyan)" />
  <text x="350" y="480" font-family="monospace" font-size="10" fill="#94a3b8">Despegue Rápido</text>

  <path d="M 310 715 L 480 600" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arr-p)" stroke-dasharray="4,4" />
  <text x="360" y="670" font-family="monospace" font-size="10" fill="#c084fc">Auditoría / Métricas</text>

  <!-- Sistema -> Externos -->
  <path d="M 920 380 L 1050 210" fill="none" stroke="#ec4899" stroke-width="2" marker-end="url(#arr-p)" />
  <text x="940" y="275" font-family="monospace" font-size="10" fill="#f472b6">Solicita Vignette Ads</text>

  <path d="M 920 490 L 1050 380" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arr-e)" />
  <text x="930" y="445" font-family="monospace" font-size="10" fill="#34d399">gdsdk.showAd()</text>

  <path d="M 920 540 L 1050 545" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arr-cyan)" />
  <text x="940" y="535" font-family="monospace" font-size="10" fill="#a5b4fc">CrazyGames SDK</text>

  <path d="M 920 620 L 1050 705" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-a)" />
  <text x="940" y="680" font-family="monospace" font-size="10" fill="#fbbf24">Hosting &amp; DB Storage</text>

  <!-- Leyenda inferior -->
  <g transform="translate(60, 850)">
    <rect width="1280" height="60" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="#334155" />
    <text x="30" y="35" font-family="'Orbitron', monospace" font-size="11" font-weight="bold" fill="#00f3ff">LEYENDA C4:</text>
    <rect x="150" y="22" width="18" height="18" rx="3" fill="#082f49" stroke="#38bdf8" />
    <text x="175" y="35" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1">Actor Humano (Piloto/Admin)</text>
    <rect x="380" y="22" width="18" height="18" rx="3" fill="#0e7490" stroke="#00f3ff" />
    <text x="405" y="35" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1">Sistema de Software Principal</text>
    <rect x="620" y="22" width="18" height="18" rx="3" fill="#140821" stroke="#c084fc" />
    <text x="645" y="35" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1">Sistema Externo (Publicidad / Hosting)</text>
    <line x1="910" y1="31" x2="950" y2="31" stroke="#00f3ff" stroke-width="2" marker-end="url(#arr-cyan)" />
    <text x="960" y="35" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1">Flujo de Datos / Invocación</text>
  </g>
</svg>