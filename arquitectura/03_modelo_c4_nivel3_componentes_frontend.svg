<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1050" width="100%" height="100%">
  <defs>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="blur" /><feComposite in="SourceGraphic" in2="blur" operator="over" /></filter>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.65" /></filter>
    <linearGradient id="bg-grad-c3f" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    <marker id="ac" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#00f3ff" /></marker>
    <marker id="ae" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#10b981" /></marker>
    <marker id="ap" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#c084fc" /></marker>
  </defs>

  <rect width="1500" height="1050" fill="url(#bg-grad-c3f)" />

  <!-- Header -->
  <rect x="30" y="20" width="1440" height="70" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#00f3ff" stroke-width="1.5" filter="url(#card-shadow)" />
  <text x="55" y="52" font-family="'Orbitron', monospace, sans-serif" font-size="20" font-weight="900" fill="#00f3ff" letter-spacing="2">MODELO C4 · NIVEL 3: COMPONENTES DEL FRONTEND SPA</text>
  <text x="55" y="74" font-family="'Rajdhani', sans-serif" font-size="14" font-weight="600" fill="#94a3b8">Descomposición Interna de Módulos JavaScript: Motor 60 FPS, Renderizadores, Capa de UI y Ads Manager</text>
  <text x="1270" y="60" font-family="monospace" font-size="11" fill="#38bdf8" font-weight="bold">C4 COMPONENT (FRONT)</text>

  <!-- Límite del Contenedor Frontend -->
  <rect x="40" y="110" width="1420" height="850" rx="14" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />
  <text x="60" y="135" font-family="'Orbitron', monospace" font-size="12" font-weight="bold" fill="#38bdf8">CONTENEDOR: FRONTEND WEB SPA (HTML5 / JAVASCRIPT ES6+)</text>

  <!-- PAQUETE 1: MOTOR DE JUEGO (Engine Core) -->
  <rect x="60" y="160" width="440" height="420" rx="10" fill="rgba(8, 47, 73, 0.8)" stroke="#38bdf8" stroke-width="1.5" filter="url(#card-shadow)" />
  <text x="80" y="190" font-family="'Orbitron', monospace" font-size="14" font-weight="bold" fill="#00f3ff">1. MOTOR CENTRAL (Engine Core)</text>
  <text x="80" y="208" font-family="monospace" font-size="10" fill="#94a3b8">frontend/js/engine.js</text>

  <rect x="80" y="225" width="400" height="70" rx="6" fill="#075985" stroke="#38bdf8" stroke-width="1" />
  <text x="95" y="248" font-family="'Orbitron', monospace" font-size="11" font-weight="bold" fill="#ffffff">Bucle Principal 60 FPS (GameLoop)</text>
  <text x="95" y="268" font-family="'Rajdhani', sans-serif" font-size="12" fill="#e0f2fe">requestAnimationFrame, cálculo delta time,</text>
  <text x="95" y="284" font-family="'Rajdhani', sans-serif" font-size="12" fill="#e0f2fe">actualización física de proyectiles, enemigos y partículas.</text>

  <rect x="80" y="310" width="400" height="70" rx="6" fill="#075985" stroke="#38bdf8" stroke-width="1" />
  <text x="95" y="333" font-family="'Orbitron', monospace" font-size="11" font-weight="bold" fill="#ffffff">Sistema de Colisiones &amp; Físicas</text>
  <text x="95" y="353" font-family="'Rajdhani', sans-serif" font-size="12" fill="#e0f2fe">AABB / Círculos de colisión hitbox entre nave,</text>
  <text x="95" y="369" font-family="'Rajdhani', sans-serif" font-size="12" fill="#e0f2fe">láseres, bombas de aniquilación y proyectiles enemigos.</text>

  <rect x="80" y="395" width="400" height="70" rx="6" fill="#075985" stroke="#38bdf8" stroke-width="1" />
  <text x="95" y="418" font-family="'Orbitron', monospace" font-size="11" font-weight="bold" fill="#ffffff">Controlador de Entrada Táctil &amp; Teclas</text>
  <text x="95" y="438" font-family="'Rajdhani', sans-serif" font-size="12" fill="#e0f2fe">WASD, flechas, ratón (e.stopPropagation), barra espaciadora,</text>
  <text x="95" y="454" font-family="'Rajdhani', sans-serif" font-size="12" fill="#e0f2fe">Bomba [B], Habilidad [E], F (Fullscreen) y gestos táctiles.</text>

  <rect x="80" y="480" width="400" height="85" rx="6" fill="#0369a1" stroke="#00f3ff" stroke-width="1.2" />
  <text x="95" y="503" font-family="'Orbitron', monospace" font-size="11" font-weight="bold" fill="#ffffff">Sintetizador de Audio Sci-Fi (Web Audio API)</text>
  <text x="95" y="523" font-family="'Rajdhani', sans-serif" font-size="12" fill="#e0f2fe">100% autosuficiente, sin archivos .mp3 externos.</text>
  <text x="95" y="538" font-family="'Rajdhani', sans-serif" font-size="12" fill="#e0f2fe">Genera láseres, explosiones y música synthwave con osciladores.</text>
  <text x="95" y="554" font-family="monospace" font-size="9" fill="#bae6fd">OscillatorNode, GainNode, BiquadFilterNode</text>

  <!-- PAQUETE 2: RENDERIZADORES VECTORIALES (Graphics) -->
  <rect x="530" y="160" width="440" height="420" rx="10" fill="rgba(4, 47, 46, 0.8)" stroke="#10b981" stroke-width="1.5" filter="url(#card-shadow)" />
  <text x="550" y="190" font-family="'Orbitron', monospace" font-size="14" font-weight="bold" fill="#34d399">2. RENDERIZADORES GRÁFICOS (Canvas 2D)</text>
  <text x="550" y="208" font-family="monospace" font-size="10" fill="#94a3b8">frontend/js/scenario_renderer.js, ship_renderer.js</text>

  <rect x="550" y="225" width="400" height="75" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1" />
  <text x="565" y="248" font-family="'Orbitron', monospace" font-size="11" font-weight="bold" fill="#ffffff">ScenarioRenderer (Escenarios Planetarios)</text>
  <text x="565" y="268" font-family="'Rajdhani', sans-serif" font-size="12" fill="#d1fae5">5 biomas: Órbita espacial, cañones desérticos, archipiélagos,</text>
  <text x="565" y="284" font-family="'Rajdhani', sans-serif" font-size="12" fill="#d1fae5">tundra ártica y fortaleza final. Efectos de clima y parallax.</text>

  <rect x="550" y="315" width="400" height="75" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1" />
  <text x="565" y="338" font-family="'Orbitron', monospace" font-size="11" font-weight="bold" fill="#ffffff">ShipRenderer (Naves &amp; Efectos)</text>
  <text x="565" y="358" font-family="'Rajdhani', sans-serif" font-size="12" fill="#d1fae5">Renderizado procedural de 5 cazas tácticos, propulsores</text>
  <text x="565" y="374" font-family="'Rajdhani', sans-serif" font-size="12" fill="#d1fae5">con estelas de partículas, escudos y chispas de daño.</text>

  <rect x="550" y="405" width="400" height="75" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1" />
  <text x="565" y="428" font-family="'Orbitron', monospace" font-size="11" font-weight="bold" fill="#ffffff">Bosses &amp; Enemies (IA Enemiga)</text>
  <text x="565" y="448" font-family="'Rajdhani', sans-serif" font-size="12" fill="#d1fae5">Patrones de ataque de drones, destructores y los 5 Super-Jefes</text>
  <text x="565" y="464" font-family="'Rajdhani', sans-serif" font-size="12" fill="#d1fae5">Dreadnought con barra de vida segmentada por fases.</text>

  <rect x="550" y="495" width="400" height="70" rx="6" fill="#047857" stroke="#34d399" stroke-width="1.2" />
  <text x="565" y="518" font-family="'Orbitron', monospace" font-size="11" font-weight="bold" fill="#ffffff">IntroCinema (Cinemática Vectorial)</text>
  <text x="565" y="538" font-family="'Rajdhani', sans-serif" font-size="12" fill="#d1fae5">Prólogo animado a 60 FPS con lore de la Federación.</text>
  <text x="565" y="552" font-family="monospace" font-size="9" fill="#a7f3d0">frontend/js/intro_cinema.js</text>

  <!-- PAQUETE 3: UI, AUTH & REDES SOCIALES -->
  <rect x="1000" y="160" width="440" height="420" rx="10" fill="rgba(42, 20, 61, 0.8)" stroke="#c084fc" stroke-width="1.5" filter="url(#card-shadow)" />
  <text x="1020" y="190" font-family="'Orbitron', monospace" font-size="14" font-weight="bold" fill="#c084fc">3. GESTIÓN DE UI &amp; SESIÓN</text>
  <text x="1020" y="208" font-family="monospace" font-size="10" fill="#94a3b8">frontend/js/app_ui.js, auth.js, api.js</text>

  <rect x="1020" y="225" width="400" height="75" rx="6" fill="#581c87" stroke="#c084fc" stroke-width="1" />
  <text x="1035" y="248" font-family="'Orbitron', monospace" font-size="11" font-weight="bold" fill="#ffffff">Auth &amp; Guest Controller (auth.js)</text>
  <text x="1035" y="268" font-family="'Rajdhani', sans-serif" font-size="12" fill="#f3e8ff">Login, registro, restablecer contraseña y botón</text>
  <text x="1035" y="284" font-family="'Rajdhani', sans-serif" font-size="12" fill="#f3e8ff">"Despegue Rápido (Invitado)" para juego inmediato.</text>

  <rect x="1020" y="315" width="400" height="75" rx="6" fill="#581c87" stroke="#c084fc" stroke-width="1" />
  <text x="1035" y="338" font-family="'Orbitron', monospace" font-size="11" font-weight="bold" fill="#ffffff">App UI &amp; Modals (app_ui.js)</text>
  <text x="1035" y="358" font-family="'Rajdhani', sans-serif" font-size="12" fill="#f3e8ff">Control de pantallas (Auth, Hangar, Briefing, Combate,</text>
  <text x="1035" y="374" font-family="'Rajdhani', sans-serif" font-size="12" fill="#f3e8ff">Victoria, Game Over y Ranking Global).</text>

  <rect x="1020" y="405" width="400" height="75" rx="6" fill="#581c87" stroke="#c084fc" stroke-width="1" />
  <text x="1035" y="428" font-family="'Orbitron', monospace" font-size="11" font-weight="bold" fill="#ffffff">SocialShare (Difusión &amp; Bonos)</text>
  <text x="1035" y="448" font-family="'Rajdhani', sans-serif" font-size="12" fill="#f3e8ff">Compartir récords en Twitter, WhatsApp, Telegram</text>
  <text x="1035" y="464" font-family="'Rajdhani', sans-serif" font-size="12" fill="#f3e8ff">otorgando bono táctico de +5 vidas con recarga de 24h.</text>

  <rect x="1020" y="495" width="400" height="70" rx="6" fill="#7e22ce" stroke="#e9d5ff" stroke-width="1.2" />
  <text x="1035" y="518" font-family="'Orbitron', monospace" font-size="11" font-weight="bold" fill="#ffffff">ApiService (Capa de Conexión HTTP)</text>
  <text x="1035" y="538" font-family="'Rajdhani', sans-serif" font-size="12" fill="#f3e8ff">Conexión resiliente a https://space-assault.onrender.com</text>
  <text x="1035" y="552" font-family="monospace" font-size="9" fill="#e9d5ff">Fetch API · JWT Headers · Health Check</text>

  <!-- PAQUETE 4: ADAPTADOR UNIVERSAL DE PUBLICIDAD (UniversalAdsManager) -->
  <rect x="60" y="610" width="1380" height="320" rx="10" fill="rgba(15, 23, 42, 0.95)" stroke="#00f3ff" stroke-width="2" filter="url(#card-shadow)" />
  <text x="80" y="640" font-family="'Orbitron', monospace" font-size="15" font-weight="bold" fill="#00f3ff">4. ADAPTADOR UNIVERSAL DE MONETIZACIÓN (UniversalAdsManager)</text>
  <text x="80" y="658" font-family="monospace" font-size="10" fill="#38bdf8">frontend/js/ads_manager.js &amp; ads_config.js</text>

  <!-- 4 Bloques Internos del Ads Manager -->
  <g transform="translate(80, 675)">
    <rect width="310" height="235" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="1.2" />
    <text x="20" y="30" font-family="'Orbitron', monospace" font-size="12" font-weight="bold" fill="#38bdf8">A. Detector de Entorno</text>
    <text x="20" y="52" font-family="monospace" font-size="10" fill="#94a3b8">detectPlatform()</text>
    <text x="20" y="80" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1">• Si window.CrazyGames ➔ CRAZYGAMES</text>
    <text x="20" y="102" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1">• Si window.gdsdk ➔ GAMEDISTRIBUTION</text>
    <text x="20" y="124" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1">• Si web propia ➔ STANDALONE_WEB</text>
    <text x="20" y="150" font-family="'Rajdhani', sans-serif" font-size="12" fill="#7dd3fc">Aislamiento total: Cada red corre en su</text>
    <text x="20" y="168" font-family="'Rajdhani', sans-serif" font-size="12" fill="#7dd3fc">propio canal sin interferir con las otras.</text>
  </g>

  <g transform="translate(420, 675)">
    <rect width="310" height="235" rx="8" fill="#042f2e" stroke="#10b981" stroke-width="1.2" />
    <text x="20" y="30" font-family="'Orbitron', monospace" font-size="12" font-weight="bold" fill="#34d399">B. Motor Anti-Frustración</text>
    <text x="20" y="52" font-family="monospace" font-size="10" fill="#94a3b8">canShowInterstitial()</text>
    <text x="20" y="80" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1">• Cooldown activo: Mínimo 75 segundos</text>
    <text x="20" y="102" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1">• Protección muerte rápida: &gt; 18s juego</text>
    <text x="20" y="124" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1">• Límite por sesión: 20 anuncios máx.</text>
    <text x="20" y="150" font-family="'Rajdhani', sans-serif" font-size="12" fill="#a7f3d0">Omisión automática por cortesía si el</text>
    <text x="20" y="168" font-family="'Rajdhani', sans-serif" font-size="12" fill="#a7f3d0">jugador cae en combate prematuro.</text>
  </g>

  <g transform="translate(760, 675)">
    <rect width="310" height="235" rx="8" fill="#140821" stroke="#ec4899" stroke-width="1.2" />
    <text x="20" y="30" font-family="'Orbitron', monospace" font-size="12" font-weight="bold" fill="#f472b6">C. Invocador Monetag Dinámico</text>
    <text x="20" y="52" font-family="monospace" font-size="10" fill="#94a3b8">_triggerMonetagVignette()</text>
    <text x="20" y="80" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1">• Zona limpia: 12128966</text>
    <text x="20" y="102" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1">• Cero popunders / OnClick apagado</text>
    <text x="20" y="124" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1">• Re-inyección en Game Over / Victoria</text>
    <text x="20" y="150" font-family="'Rajdhani', sans-serif" font-size="12" fill="#fbcfe8">vignette.min.js invocado activamente</text>
    <text x="20" y="168" font-family="'Rajdhani', sans-serif" font-size="12" fill="#fbcfe8">para asegurar impresiones remuneradas.</text>
  </g>

  <g transform="translate(1100, 675)">
    <rect width="320" height="235" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2" />
    <text x="20" y="30" font-family="'Orbitron', monospace" font-size="12" font-weight="bold" fill="#a5b4fc">D. Gestor Rewarded Rescate</text>
    <text x="20" y="52" font-family="monospace" font-size="10" fill="#94a3b8">showRewardedAd(onRewarded)</text>
    <text x="20" y="80" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1">• Botón: "Revivir nave con escudo 100%"</text>
    <text x="20" y="102" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1">• +2 vidas de rescate en fase actual</text>
    <text x="20" y="124" font-family="'Rajdhani', sans-serif" font-size="12" fill="#cbd5e1">• CrazyGames &amp; GameDistribution API</text>
    <text x="20" y="150" font-family="'Rajdhani', sans-serif" font-size="12" fill="#c7d2fe">Convierte la publicidad en un superpoder</text>
    <text x="20" y="168" font-family="'Rajdhani', sans-serif" font-size="12" fill="#c7d2fe">voluntario elegido por el jugador.</text>
  </g>

  <!-- Leyenda inferior -->
  <g transform="translate(40, 975)">
    <rect width="1420" height="50" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#334155" />
    <text x="25" y="30" font-family="'Orbitron', monospace" font-size="11" font-weight="bold" fill="#00f3ff">MÓDULOS DEL FRONTEND:</text>
    <text x="240" y="30" font-family="'Rajdhani', sans-serif" font-size="12" fill="#38bdf8">● Motor Canvas 60 FPS (Físicas &amp; Audio)</text>
    <text x="560" y="30" font-family="'Rajdhani', sans-serif" font-size="12" fill="#34d399">● Renderizadores Vectoriales (Biomas &amp; Jefes)</text>
    <text x="910" y="30" font-family="'Rajdhani', sans-serif" font-size="12" fill="#c084fc">● UI &amp; ApiService (Auth, Invitado &amp; JWT)</text>
    <text x="1230" y="30" font-family="'Rajdhani', sans-serif" font-size="12" fill="#00f3ff">● Universal Ads Manager</text>
  </g>
</svg>